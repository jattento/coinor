mouse-shift-capture = never

# Conan Code terminal theme.
#
# A neutral near-black palette pulled directly from the Codex desktop
# app itself: main background #181818, card/black #2d2d2d, and the
# muted accent colors Codex already uses for diff stats and status
# (soft green, coral red, amber warning, sky blue). Conan Code's own
# native sidebar is a very close neutral near-black too, so this
# background reads as one continuous surface with both the sidebar
# and the wider Codex-family look, instead of a colorful, saturated
# scheme bolted onto quiet neutral chrome.
#
# This file loads after Ghostty's normal config file search (see
# GhosttyConfiguration.swift), so every key below overrides -- but
# never edits -- ~/.config/ghostty and the standalone Ghostty.app's
# own Application Support preferences. Those stay exactly as they
# were; only Conan Code's embedded terminal uses this theme.
background = #181818
foreground = #e8e8e8
background-opacity = 1
minimum-contrast = 1
bold-color = bright

cursor-color = #91c1fa
cursor-text = #181818
cursor-style = block
cursor-style-blink = false

selection-background = #2a353a
selection-foreground = #e8e8e8

palette = 0=#2d2d2d
palette = 1=#e75248
palette = 2=#6bc67f
palette = 3=#ef8c57
palette = 4=#91c1fa
palette = 5=#b9a3ec
palette = 6=#7fd4c1
palette = 7=#c7c7c7
palette = 8=#969696
palette = 9=#e75248
palette = 10=#6bc67f
palette = 11=#ef8c57
palette = 12=#91c1fa
palette = 13=#b9a3ec
palette = 14=#7fd4c1
palette = 15=#f2f2f2
