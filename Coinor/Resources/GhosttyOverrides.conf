mouse-shift-capture = never

# Conan Code terminal theme -- "Codex Dark".
#
# Matches the Codex desktop app's own Codex Dark theme card: near-black
# background #181818, surface/card black #2d2d2b, and a single bright
# blue #339cff accent (also applied to the cursor and, via AccentColor,
# to the selected-tab underline). The base letter color is a warm cream
# rather than the card's plain white so long terminal sessions read
# less clinical. ANSI colors keep the existing muted Codex diff/status
# hues (soft green, coral red, amber warning, sky blue) so command
# output stays easy to scan. Conan Code's own native sidebar is a very
# close neutral near-black too, so this background reads as one
# continuous surface with both the sidebar and the wider Codex-family
# look, instead of a colorful, saturated scheme bolted onto quiet
# neutral chrome.
#
# This file loads after Ghostty's normal config file search (see
# GhosttyConfiguration.swift), so every key below overrides -- but
# never edits -- ~/.config/ghostty and the standalone Ghostty.app's
# own Application Support preferences. Those stay exactly as they
# were; only Conan Code's embedded terminal uses this theme.
background = #181818
foreground = #faf3dd
background-opacity = 1
minimum-contrast = 1
bold-color = bright

cursor-color = #339cff
cursor-text = #181818
cursor-style = block
cursor-style-blink = false

selection-background = #2a353a
selection-foreground = #faf3dd

palette = 0=#2d2d2b
palette = 1=#e75248
palette = 2=#6bc67f
palette = 3=#ef8c57
palette = 4=#91c1fa
palette = 5=#b9a3ec
palette = 6=#7fd4c1
palette = 7=#c7c7c7
palette = 8=#969696
palette = 9=#e75248
palette = 10=#6bc67f
palette = 11=#ef8c57
palette = 12=#91c1fa
palette = 13=#b9a3ec
palette = 14=#7fd4c1
palette = 15=#f2f2f2
